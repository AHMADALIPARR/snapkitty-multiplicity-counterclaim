[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmhes-counter"
version = "0.1.0"
description = "Counter-models to Van Gelder's QMHES claims. Not a cryptosystem."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
  {name = "Bel esprit D'accord Trust"},
  {name = "Ahmad Ali Parr"},
  {name = "Jessica Westerhoff"},
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
